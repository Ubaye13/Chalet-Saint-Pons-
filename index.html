<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalet Saint-Pons</title>
<meta name="theme-color" content="#14201A">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2314201A'/%3E%3Cpath d='M38 78 L38 55 L33 46 L38 46 L34 38 L39 38 L36 31 L44 40 L56 40 L64 31 L61 38 L66 38 L62 46 L67 46 L62 55 L62 78 L56 78 L56 62 L44 62 L44 78 Z' fill='%23C9A227'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0E1712;min-height:100vh;color:#E8E4DA}

.hidden{display:none!important}

.hero{position:relative;overflow:hidden;background:#14201A;padding:1.4rem 1.25rem 4.5rem}
.hero-scene{position:absolute;inset:0;width:100%;height:100%}
.hero-inner{position:relative;z-index:3}
.hero-title{font-size:17px;font-weight:600;color:#F2EFE6;letter-spacing:.4px}
.hero-sub{font-size:11.5px;color:rgba(242,239,230,.55);margin-top:3px;letter-spacing:.2px}
.logout-btn{position:absolute;top:0;right:0;z-index:4;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#E8E4DA;border-radius:20px;padding:6px 13px;font-size:11.5px;cursor:pointer;backdrop-filter:blur(6px)}

.balance-card{margin:-2.4rem 1rem 0;background:#1B2921;border:1px solid rgba(201,162,39,.22);border-radius:18px;padding:1.35rem;position:relative;z-index:6;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.balance-label{font-size:11.5px;color:#9BA79D;margin-bottom:6px;text-transform:uppercase;letter-spacing:.7px}
.balance-amount{font-size:38px;font-weight:600;color:#C9A227;line-height:1;letter-spacing:-.5px}
.balance-total{font-size:12.5px;color:#7D897F;margin-top:6px}
.progress-bar{height:7px;background:#0E1712;border-radius:4px;margin-top:1.1rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#8A7A1E,#C9A227);border-radius:4px;transition:width .7s ease;width:0%}
.progress-labels{display:flex;justify-content:space-between;font-size:11px;color:#7D897F;margin-top:7px}

.tab-bar{display:flex;gap:4px;padding:1rem 1rem .25rem}
.tab{flex:1;padding:11px 4px;font-size:12px;font-weight:600;color:#7D897F;border:1px solid transparent;background:#16231C;border-radius:11px;cursor:pointer;position:relative;transition:all .2s}
.tab.active{color:#C9A227;background:#1B2921;border-color:rgba(201,162,39,.3)}
.tab-dot{position:absolute;top:6px;right:8px;width:6px;height:6px;background:#D4653F;border-radius:50%;display:none}

.section{padding:.75rem 1rem 1.5rem}
.section-title{font-size:11px;font-weight:600;color:#7D897F;text-transform:uppercase;letter-spacing:.9px;margin-bottom:.8rem}

.payment-card{background:#16231C;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.6rem}
.payment-card.approved{border-left:3px solid #C9A227}
.payment-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.payment-amount{font-size:19px;font-weight:600;color:#E8E4DA}
.payment-meta{font-size:11.5px;color:#7D897F;margin-top:4px;line-height:1.5}
.lock-line{font-size:10.5px;color:#6B7670;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.05)}
.badge{font-size:10.5px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap;letter-spacing:.3px}
.badge-pending{background:rgba(201,162,39,.14);color:#C9A227}
.badge-approved{background:rgba(122,163,110,.16);color:#8FBF7F}
.badge-rejected{background:rgba(212,101,63,.14);color:#D4653F}

.action-btns{display:flex;gap:8px;margin-top:.9rem}
.btn{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.btn-approve{background:#C9A227;color:#14201A}
.btn-reject{background:rgba(212,101,63,.16);color:#D4653F}
.delete-link{background:none;border:none;color:#5E6962;font-size:11px;cursor:pointer;padding:9px 0 0;display:inline-block}
.delete-confirm{background:rgba(212,101,63,.1);border:1px solid rgba(212,101,63,.28);border-radius:11px;padding:10px 12px;margin-top:.8rem;font-size:12px;color:#E0A088;line-height:1.5}
.confirm-btns{display:flex;gap:7px;margin-top:10px}
.btn-sm{padding:7px 13px;border-radius:9px;font-size:12px;cursor:pointer;border:none;font-weight:600}
.btn-sm-danger{background:#D4653F;color:#14201A}
.btn-sm-cancel{background:rgba(255,255,255,.06);color:#9BA79D;border:1px solid rgba(255,255,255,.1)}
.delete-wait{font-size:11px;color:#C9A227;background:rgba(201,162,39,.1);border-radius:9px;padding:8px 11px;margin-top:9px;line-height:1.5}

.input-card{background:#16231C;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:1.2rem}
.field-label{font-size:11px;color:#7D897F;margin-bottom:7px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.amount-input{width:100%;font-size:30px;font-weight:600;border:none;border-bottom:2px solid rgba(201,162,39,.4);padding:4px 0 10px;color:#C9A227;background:transparent;outline:none;margin-bottom:1.3rem}
.amount-input::placeholder{color:#3A463E}
.amount-input:focus{border-bottom-color:#C9A227}
.date-input,.note-input{width:100%;font-size:14px;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:11px;margin-bottom:1.3rem;color:#E8E4DA;background:#0E1712;outline:none;font-family:inherit}
.note-input{resize:none;height:66px}
.note-input::placeholder{color:#4A554D}
.date-input:focus,.note-input:focus{border-color:rgba(201,162,39,.5)}
.btn-send{width:100%;padding:14px;background:#C9A227;color:#14201A;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.btn-send:active{opacity:.85}
.send-error{font-size:12px;color:#D4653F;display:none;margin-bottom:11px}

.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 150px)}
.chat-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:9px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg-mine{align-self:flex-end;background:#C9A227;color:#14201A;border-bottom-right-radius:5px}
.msg-theirs{align-self:flex-start;background:#1B2921;color:#E8E4DA;border:1px solid rgba(255,255,255,.07);border-bottom-left-radius:5px}
.msg-time{font-size:9.5px;opacity:.55;margin-top:5px;display:block}
.msg-day{align-self:center;font-size:10.5px;color:#6B7670;background:#16231C;padding:5px 14px;border-radius:20px;margin:8px 0}
.chat-input-bar{display:flex;gap:9px;padding:.85rem;background:#14201A;border-top:1px solid rgba(255,255,255,.06);align-items:flex-end}
.chat-input{flex:1;font-size:14px;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:11px 16px;outline:none;resize:none;max-height:100px;font-family:inherit;color:#E8E4DA;background:#0E1712}
.chat-input::placeholder{color:#4A554D}
.chat-input:focus{border-color:rgba(201,162,39,.45)}
.chat-send{width:44px;height:44px;border-radius:50%;background:#C9A227;color:#14201A;border:none;font-size:17px;cursor:pointer;flex-shrink:0}
.chat-send:active{opacity:.85}
.chat-empty{text-align:center;color:#5E6962;font-size:13px;margin:auto;line-height:1.9}

.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;background:#0E1712;position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.login-content{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center}
.login-title{font-size:25px;font-weight:600;color:#F2EFE6;margin-bottom:7px;letter-spacing:.3px}
.login-sub{font-size:12.5px;color:#7D897F;margin-bottom:2.2rem;text-align:center;line-height:1.7;letter-spacing:.3px}
.login-card{width:100%;max-width:330px;background:rgba(27,41,33,.82);border:1px solid rgba(201,162,39,.2);border-radius:18px;padding:1.5rem;backdrop-filter:blur(10px)}
.btn-google{width:100%;padding:13px;background:#F2EFE6;color:#1B2921;border:none;border-radius:11px;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:11px}
.btn-google:active{opacity:.9}
.login-error{font-size:12px;color:#E0A088;background:rgba(212,101,63,.14);border:1px solid rgba(212,101,63,.3);border-radius:11px;padding:11px 13px;margin-bottom:1.1rem;display:none;line-height:1.5}
.empty-state{text-align:center;padding:2.8rem 1rem;color:#5E6962;font-size:13.5px;line-height:1.9}
.loading{text-align:center;padding:2rem;color:#5E6962;font-size:12.5px}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHSH4J7y0HxPR2V6NgNUAHv343ivW6UPA",
  authDomain: "chalet-saint-pons.firebaseapp.com",
  projectId: "chalet-saint-pons",
  storageBucket: "chalet-saint-pons.firebasestorage.app",
  messagingSenderId: "809641153285",
  appId: "1:809641153285:web:69fb8eb0e56861646c1d6c"
};

const H_NICO = "6e405c892f5523fb75a280d01e5dcaee99d140f0c9495a5331e4e833385c5120";
const H_ELODIE = "8c75a0a565c570d9dcccc1d78453f5d1fda9232c9e0d52d238df01659649f65a";
const TOTAL_DEBT = 30000;

async function sha(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let myHash = "";
let confirmingDelete = null;
let payments = [];
let messages = [];
let unsubP = null;
let unsubM = null;
let currentTab = 'history';
let lastSeenCount = 0;

function nameFor(h) {
  if (h === H_NICO) return 'Nico';
  if (h === H_ELODIE) return 'Elodie';
  return 'Inconnu';
}

window.signInWithGoogle = async function () {
  try {
    const res = await signInWithPopup(auth, new GoogleAuthProvider());
    const h = await sha(res.user.email);
    if (h !== H_NICO && h !== H_ELODIE) {
      document.getElementById('loginError').style.display = 'block';
      await signOut(auth);
    }
  } catch (e) { console.error(e); }
};

window.doSignOut = async function () {
  if (unsubP) { unsubP(); unsubP = null; }
  if (unsubM) { unsubM(); unsubM = null; }
  await signOut(auth);
};

window.showTab = function (tab) {
  currentTab = tab;
  document.getElementById('tabContentHistory').classList.toggle('hidden', tab !== 'history');
  document.getElementById('tabContentSend').classList.toggle('hidden', tab !== 'send');
  document.getElementById('tabContentChat').classList.toggle('hidden', tab !== 'chat');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('tabSend').classList.toggle('active', tab === 'send');
  document.getElementById('tabChat').classList.toggle('active', tab === 'chat');
  document.getElementById('balanceCard').classList.toggle('hidden', tab === 'chat');
  if (tab === 'chat') {
    lastSeenCount = messages.length;
    document.getElementById('chatDot').style.display = 'none';
    setTimeout(scrollChatBottom, 50);
  }
};

window.proposePayment = async function () {
  const amount = parseFloat(document.getElementById('amountInput').value);
  const date = document.getElementById('dateInput').value;
  const note = document.getElementById('noteInput').value.trim();
  const err = document.getElementById('sendError');

  if (!amount || amount <= 0) { err.textContent = 'Entrez un montant valide.'; err.style.display = 'block'; return; }
  if (!date) { err.textContent = 'Choisissez une date.'; err.style.display = 'block'; return; }
  const paidNow = payments.filter(function (p) { return p.status === 'approved'; }).reduce(function (s, p) { return s + p.amount; }, 0);
  const remaining = TOTAL_DEBT - paidNow;
  if (amount > remaining) { err.textContent = 'Le montant depasse le reste du (' + remaining.toLocaleString('fr-FR') + ' EUR).'; err.style.display = 'block'; return; }
  err.style.display = 'none';

  await addDoc(collection(db, 'payments'), {
    amount: amount, date: date, note: note,
    status: 'pending',
    proposedBy: myHash,
    deleteRequest: null,
    createdAt: serverTimestamp()
  });

  document.getElementById('amountInput').value = '';
  document.getElementById('noteInput').value = '';
  showTab('history');
};

window.approvePayment = async function (id) { await updateDoc(doc(db, 'payments', id), { status: 'approved' }); };
window.rejectPayment = async function (id) { await updateDoc(doc(db, 'payments', id), { status: 'rejected' }); };
window.requestDelete = function (id) { confirmingDelete = id; render(); };
window.cancelDelete = function () { confirmingDelete = null; render(); };
window.askDelete = async function (id) { await updateDoc(doc(db, 'payments', id), { deleteRequest: myHash }); confirmingDelete = null; };
window.confirmDelete = async function (id) { await deleteDoc(doc(db, 'payments', id)); confirmingDelete = null; };
window.refuseDelete = async function (id) { await updateDoc(doc(db, 'payments', id), { deleteRequest: null }); };

window.sendMessage = async function () {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  await addDoc(collection(db, 'messages'), {
    text: text,
    author: myHash,
    createdAt: serverTimestamp()
  });
};

function scrollChatBottom() {
  const box = document.getElementById('chatMessages');
  box.scrollTop = box.scrollHeight;
}

function fmtDate(d) {
  if (!d) return '';
  const p = d.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = ts.toDate();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function fmtDayLabel(ts) {
  if (!ts) return '';
  const d = ts.toDate();
  const today = new Date();
  const y = new Date(); y.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return "Aujourd'hui";
  if (d.toDateString() === y.toDateString()) return 'Hier';
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateBalance() {
  const paid = payments.filter(function (p) { return p.status === 'approved'; }).reduce(function (s, p) { return s + p.amount; }, 0);
  const remaining = Math.max(0, TOTAL_DEBT - paid);
  const pct = Math.round((paid / TOTAL_DEBT) * 100);
  document.getElementById('balanceDisplay').textContent = remaining.toLocaleString('fr-FR') + ' \u20AC';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('paidLabel').textContent = paid.toLocaleString('fr-FR') + ' \u20AC rembourse';
  document.getElementById('pctLabel').textContent = pct + ' %';
}

function render() {
  const list = document.getElementById('paymentsList');
  if (!payments.length) {
    list.innerHTML = '<div class="empty-state">Aucun versement pour le moment.</div>';
    return;
  }
  const isElodie = myHash === H_ELODIE;

  list.innerHTML = payments.map(function (p) {
    const approved = p.status === 'approved';
    let badge = '<span class="badge badge-pending">En attente</span>';
    if (approved) badge = '<span class="badge badge-approved">Approuve</span>';
    if (p.status === 'rejected') badge = '<span class="badge badge-rejected">Refuse</span>';

    let actions = '';
    if (p.status === 'pending' && isElodie) {
      actions = '<div class="action-btns"><button class="btn btn-approve" onclick="approvePayment(\'' + p.id + '\')">Approuver</button><button class="btn btn-reject" onclick="rejectPayment(\'' + p.id + '\')">Refuser</button></div>';
    }

    const lock = approved ? '<div class="lock-line">Verrouille - suppression uniquement avec accord des deux</div>' : '';

    let del = '';
    if (confirmingDelete === p.id) {
      del = '<div class="delete-confirm">Demander la suppression de ce versement ?<div class="confirm-btns"><button class="btn-sm btn-sm-danger" onclick="askDelete(\'' + p.id + '\')">Oui, demander</button><button class="btn-sm btn-sm-cancel" onclick="cancelDelete()">Annuler</button></div></div>';
    } else if (!p.deleteRequest) {
      del = '<button class="delete-link" onclick="requestDelete(\'' + p.id + '\')">Demander la suppression</button>';
    } else if (p.deleteRequest === myHash) {
      del = '<div class="delete-wait">Suppression demandee - en attente de l accord de l autre</div>';
    } else {
      del = '<div class="delete-confirm">' + nameFor(p.deleteRequest) + ' demande la suppression de ce versement.<div class="confirm-btns"><button class="btn-sm btn-sm-danger" onclick="confirmDelete(\'' + p.id + '\')">Confirmer</button><button class="btn-sm btn-sm-cancel" onclick="refuseDelete(\'' + p.id + '\')">Refuser</button></div></div>';
    }

    return '<div class="payment-card' + (approved ? ' approved' : '') + '">' +
      '<div class="payment-row"><div>' +
      '<div class="payment-amount">' + p.amount.toLocaleString('fr-FR') + ' \u20AC</div>' +
      '<div class="payment-meta">' + fmtDate(p.date) + ' &middot; ' + nameFor(p.proposedBy) + (p.note ? '<br>' + esc(p.note) : '') + '</div>' +
      '</div>' + badge + '</div>' + lock + actions + del + '</div>';
  }).join('');
}

function renderChat() {
  const box = document.getElementById('chatMessages');
  if (!messages.length) {
    box.innerHTML = '<div class="chat-empty">Aucun message.<br>Ecrivez le premier !</div>';
    return;
  }
  let html = '';
  let lastDay = '';
  messages.forEach(function (m) {
    const day = fmtDayLabel(m.createdAt);
    if (day && day !== lastDay) {
      html += '<div class="msg-day">' + day + '</div>';
      lastDay = day;
    }
    const mine = m.author === myHash;
    html += '<div class="msg ' + (mine ? 'msg-mine' : 'msg-theirs') + '">' +
      esc(m.text).replace(/\n/g, '<br>') +
      '<span class="msg-time">' + fmtTime(m.createdAt) + '</span></div>';
  });
  box.innerHTML = html;
}

document.getElementById('chatInput').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

onAuthStateChanged(auth, async function (user) {
  let ok = false;
  if (user) {
    myHash = await sha(user.email);
    ok = (myHash === H_NICO || myHash === H_ELODIE);
  }

  if (ok) {
    currentUser = user;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('userGreeting').textContent = nameFor(myHash);
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    showTab(myHash === H_ELODIE ? 'history' : 'send');

    const qp = query(collection(db, 'payments'), orderBy('createdAt', 'desc'));
    unsubP = onSnapshot(qp, function (snap) {
      payments = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      updateBalance();
      render();
    });

    const qm = query(collection(db, 'messages'), orderBy('createdAt', 'asc'));
    unsubM = onSnapshot(qm, function (snap) {
      messages = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      renderChat();
      if (currentTab === 'chat') {
        lastSeenCount = messages.length;
        setTimeout(scrollChatBottom, 30);
      } else if (messages.length > lastSeenCount) {
        document.getElementById('chatDot').style.display = 'block';
      }
    });
  } else {
    currentUser = null;
    myHash = '';
    payments = [];
    messages = [];
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
  }
});
</script>
