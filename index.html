<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalet Saint-Pons</title>
<meta name="theme-color" content="#2C4A3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232C4A3E'/%3E%3Cpolygon points='10,80 30,35 45,60 60,20 80,55 90,40 90,80' fill='%23F5F3EE'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#F5F3EE;min-height:100vh}
.hidden{display:none!important}

.hero{background:#2C4A3E;padding:1.5rem 1.25rem 3rem;position:relative;overflow:hidden}
.hero-scene{position:absolute;bottom:0;left:0;right:0;height:90px}
.hero-title{font-size:16px;font-weight:600;color:#F0EDE8;letter-spacing:.3px;position:relative;z-index:2}
.hero-sub{font-size:12px;color:rgba(240,237,232,.65);margin-top:3px;position:relative;z-index:2}
.logout-btn{position:absolute;top:1.25rem;right:1.25rem;z-index:3;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#F0EDE8;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}

.balance-card{margin:-1.5rem 1rem 0;background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:1.25rem;position:relative;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.balance-label{font-size:12px;color:#7c7a74;margin-bottom:4px}
.balance-amount{font-size:34px;font-weight:600;color:#2C4A3E;line-height:1.1}
.balance-total{font-size:13px;color:#a8a69f;margin-top:3px}
.progress-bar{height:9px;background:#efece5;border-radius:5px;margin-top:1rem;overflow:hidden}
.progress-fill{height:100%;background:#3D6B5C;border-radius:5px;transition:width .6s ease;width:0%}
.progress-labels{display:flex;justify-content:space-between;font-size:11px;color:#a8a69f;margin-top:5px}

.tab-bar{display:flex;border-bottom:1px solid #e3e0d8;background:#fff;padding:0 .5rem;margin-top:1rem}
.tab{flex:1;padding:13px 4px;font-size:12px;font-weight:600;color:#a8a69f;border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;position:relative}
.tab.active{color:#2C4A3E;border-bottom-color:#2C4A3E}
.tab-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;background:#c0392b;border-radius:50%;display:none}

.section{padding:1rem}
.section-title{font-size:12px;font-weight:600;color:#7c7a74;text-transform:uppercase;letter-spacing:.6px;margin-bottom:.75rem}

.payment-card{background:#fff;border:1px solid #e3e0d8;border-radius:12px;padding:1rem;margin-bottom:.6rem}
.payment-card.approved{border-left:3px solid #3D6B5C}
.payment-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.payment-amount{font-size:18px;font-weight:600;color:#2C4A3E}
.payment-meta{font-size:12px;color:#a8a69f;margin-top:3px;line-height:1.4}
.lock-line{font-size:11px;color:#a8a69f;margin-top:8px}
.badge{font-size:11px;padding:4px 9px;border-radius:7px;font-weight:600;white-space:nowrap}
.badge-pending{background:#FFF3CD;color:#856404}
.badge-approved{background:#D1E7DD;color:#0A5931}
.badge-rejected{background:#F8D7DA;color:#721C24}

.action-btns{display:flex;gap:8px;margin-top:.8rem}
.btn{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.btn-approve{background:#3D6B5C;color:#fff}
.btn-reject{background:#F8D7DA;color:#721C24}
.delete-link{background:none;border:none;color:#b5b3ac;font-size:11px;cursor:pointer;padding:6px 0 0;display:inline-block}
.delete-confirm{background:#F8D7DA;border:1px solid #F5C2C7;border-radius:8px;padding:9px 12px;margin-top:.7rem;font-size:12px;color:#721C24;line-height:1.4}
.confirm-btns{display:flex;gap:6px;margin-top:9px}
.btn-sm{padding:6px 11px;border-radius:7px;font-size:12px;cursor:pointer;border:none;font-weight:600}
.btn-sm-danger{background:#721C24;color:#fff}
.btn-sm-cancel{background:#f2efe9;color:#7c7a74;border:1px solid #e3e0d8}
.delete-wait{font-size:11px;color:#856404;background:#FFF3CD;border-radius:6px;padding:6px 9px;margin-top:8px;line-height:1.4}

.input-card{background:#fff;border:1px solid #e3e0d8;border-radius:12px;padding:1.1rem}
.field-label{font-size:12px;color:#7c7a74;margin-bottom:5px;display:block;font-weight:500}
.amount-input{width:100%;font-size:26px;font-weight:600;border:none;border-bottom:2px solid #3D6B5C;padding:5px 0;color:#2C4A3E;background:transparent;outline:none;margin-bottom:1rem}
.date-input,.note-input{width:100%;font-size:14px;border:1px solid #e3e0d8;border-radius:8px;padding:10px;margin-bottom:1rem;color:#2C4A3E;background:#fff;outline:none}
.note-input{resize:none;height:64px}
.date-input:focus,.note-input:focus{border-color:#3D6B5C}
.btn-send{width:100%;padding:13px;background:#2C4A3E;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer}
.btn-send:active{opacity:.85}
.send-error{font-size:12px;color:#721C24;display:none;margin-bottom:10px}

.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 60px)}
.chat-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;word-wrap:break-word}
.msg-mine{align-self:flex-end;background:#2C4A3E;color:#F0EDE8;border-bottom-right-radius:4px}
.msg-theirs{align-self:flex-start;background:#fff;color:#2C4A3E;border:1px solid #e3e0d8;border-bottom-left-radius:4px}
.msg-time{font-size:10px;opacity:.6;margin-top:4px;display:block}
.msg-day{align-self:center;font-size:11px;color:#a8a69f;background:#efece5;padding:4px 12px;border-radius:10px;margin:6px 0}
.chat-input-bar{display:flex;gap:8px;padding:.75rem;background:#fff;border-top:1px solid #e3e0d8;align-items:flex-end}
.chat-input{flex:1;font-size:14px;border:1px solid #e3e0d8;border-radius:20px;padding:10px 14px;outline:none;resize:none;max-height:100px;font-family:inherit;color:#2C4A3E}
.chat-input:focus{border-color:#3D6B5C}
.chat-send{width:42px;height:42px;border-radius:50%;background:#2C4A3E;color:#fff;border:none;font-size:18px;cursor:pointer;flex-shrink:0}
.chat-send:active{opacity:.85}
.chat-empty{text-align:center;color:#b5b3ac;font-size:13px;margin:auto;line-height:1.8}

.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:#F5F3EE}
.login-scene{width:100%;max-width:300px;margin-bottom:1rem}
.login-title{font-size:22px;font-weight:600;color:#2C4A3E;margin-bottom:5px}
.login-sub{font-size:13px;color:#a8a69f;margin-bottom:2rem;text-align:center;line-height:1.5}
.login-card{width:100%;max-width:320px;background:#fff;border:1px solid #e3e0d8;border-radius:14px;padding:1.5rem}
.btn-google{width:100%;padding:13px;background:#fff;color:#333;border:1px solid #dadce0;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-google:active{background:#f6f6f6}
.login-error{font-size:12px;color:#721C24;background:#F8D7DA;border-radius:8px;padding:10px 12px;margin-bottom:1rem;display:none;line-height:1.4}
.empty-state{text-align:center;padding:2.5rem 1rem;color:#b5b3ac;font-size:14px;line-height:1.7}
.loading{text-align:center;padding:2rem;color:#a8a69f;font-size:13px}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <svg class="login-scene" viewBox="0 0 300 130">
    <polygon points="0,130 45,55 80,90 130,30 180,80 225,45 300,100 300,130" fill="#2C4A3E"/>
    <polygon points="130,30 148,55 112,55" fill="#F5F3EE"/>
    <polygon points="225,45 238,65 212,65" fill="#F5F3EE"/>
    <g fill="#1d3329">
      <path d="M196 130 l0-13 3-5 0-7 -3-4 4 1 3 5 9 0 3-5 4-1 -3 4 0 7 3 5 0 13 -3 0 0-10 -11 0 0 10z"/>
      <path d="M203 101 l-4-9 3 2 2 5z"/>
      <path d="M215 101 l4-9 -3 2 -2 5z"/>
    </g>
    <g fill="#1d3329" opacity=".6">
      <path d="M243 130 l0-9 2-3 0-5 -2-3 3 1 2 3 6 0 2-3 3-1 -2 3 0 5 2 3 0 9 -2 0 0-7 -8 0 0 7z"/>
    </g>
  </svg>
  <div class="login-title">Chalet Saint-Pons</div>
  <div class="login-sub">Vallee de l'Ubaye<br>Alpes de Haute-Provence</div>
  <div class="login-card">
    <div class="login-error" id="loginError">Acces refuse. Seuls Nico et Elodie peuvent se connecter.</div>
    <button class="btn-google" onclick="signInWithGoogle()">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Se connecter avec Google
    </button>
  </div>
</div>

<div id="mainApp" class="hidden">
  <div class="hero">
    <svg class="hero-scene" viewBox="0 0 400 90" preserveAspectRatio="none">
      <polygon points="0,90 55,30 100,58 160,12 225,50 285,22 340,55 400,35 400,90" fill="#F5F3EE" opacity=".22"/>
      <g fill="#F5F3EE" opacity=".5">
        <path d="M296 90 l0-14 3-5 0-8 -4-5 5 2 3 6 10 0 3-6 5-2 -4 5 0 8 3 5 0 14 -3 0 0-11 -12 0 0 11z"/>
        <path d="M303 58 l-5-10 4 2 2 6z"/>
        <path d="M317 58 l5-10 -4 2 -2 6z"/>
      </g>
      <g fill="#F5F3EE" opacity=".3">
        <path d="M348 90 l0-10 2-4 0-5 -3-4 4 1 2 4 7 0 2-4 4-1 -3 4 0 5 2 4 0 10 -2 0 0-8 -9 0 0 8z"/>
      </g>
    </svg>
    <div class="hero-title">Chalet Saint-Pons</div>
    <div class="hero-sub" id="userGreeting"></div>
    <button class="logout-btn" onclick="doSignOut()">Deconnexion</button>
  </div>

  <div class="balance-card" id="balanceCard">
    <div class="balance-label">Reste a rembourser a Elodie</div>
    <div class="balance-amount" id="balanceDisplay">30 000 &euro;</div>
    <div class="balance-total">sur 30 000 &euro; au total</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-labels">
      <span id="paidLabel">0 &euro; rembourse</span>
      <span id="pctLabel">0 %</span>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" id="tabHistory" onclick="showTab('history')">Historique</button>
    <button class="tab" id="tabSend" onclick="showTab('send')">Versement</button>
    <button class="tab" id="tabChat" onclick="showTab('chat')">Messages<span class="tab-dot" id="chatDot"></span></button>
  </div>

  <div id="tabContentHistory">
    <div class="section">
      <div class="section-title">Versements</div>
      <div id="paymentsList"><div class="loading">Chargement...</div></div>
    </div>
  </div>

  <div id="tabContentSend" class="hidden">
    <div class="section">
      <div class="section-title">Proposer un versement</div>
      <div class="input-card">
        <label class="field-label">Montant (&euro;)</label>
        <input class="amount-input" id="amountInput" type="number" inputmode="decimal" placeholder="1000" min="1">
        <label class="field-label">Date du versement</label>
        <input class="date-input" id="dateInput" type="date">
        <label class="field-label">Note (facultatif)</label>
        <textarea class="note-input" id="noteInput" placeholder="Virement de janvier..."></textarea>
        <div class="send-error" id="sendError"></div>
        <button class="btn-send" onclick="proposePayment()">Envoyer pour approbation</button>
      </div>
    </div>
  </div>

  <div id="tabContentChat" class="hidden">
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessages"><div class="chat-empty">Chargement...</div></div>
      <div class="chat-input-bar">
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="Votre message..."></textarea>
        <button class="chat-send" onclick="sendMessage()">&#10148;</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHSH4J7y0HxPR2V6NgNUAHv343ivW6UPA",
  authDomain: "chalet-saint-pons.firebaseapp.com",
  projectId: "chalet-saint-pons",
  storageBucket: "chalet-saint-pons.firebasestorage.app",
  messagingSenderId: "809641153285",
  appId: "1:809641153285:web:69fb8eb0e56861646c1d6c"
};

const EMAIL_NICO = "mac13012@gmail.com";
const EMAIL_ELODIE = "maillau.elodie@gmail.com";
const ALLOWED = [EMAIL_NICO, EMAIL_ELODIE];
const TOTAL_DEBT = 30000;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let confirmingDelete = null;
let payments = [];
let messages = [];
let unsubP = null;
let unsubM = null;
let currentTab = 'history';
let lastSeenCount = 0;

window.signInWithGoogle = async function () {
  try {
    const res = await signInWithPopup(auth, new GoogleAuthProvider());
    if (!ALLOWED.includes(res.user.email)) {
      document.getElementById('loginError').style.display = 'block';
      await signOut(auth);
    }
  } catch (e) { console.error(e); }
};

window.doSignOut = async function () {
  if (unsubP) { unsubP(); unsubP = null; }
  if (unsubM) { unsubM(); unsubM = null; }
  await signOut(auth);
};

window.showTab = function (tab) {
  currentTab = tab;
  document.getElementById('tabContentHistory').classList.toggle('hidden', tab !== 'history');
  document.getElementById('tabContentSend').classList.toggle('hidden', tab !== 'send');
  document.getElementById('tabContentChat').classList.toggle('hidden', tab !== 'chat');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('tabSend').classList.toggle('active', tab === 'send');
  document.getElementById('tabChat').classList.toggle('active', tab === 'chat');
  document.getElementById('balanceCard').classList.toggle('hidden', tab === 'chat');
  if (tab === 'chat') {
    lastSeenCount = messages.length;
    document.getElementById('chatDot').style.display = 'none';
    setTimeout(scrollChatBottom, 50);
  }
};

window.proposePayment = async function () {
  const amount = parseFloat(document.getElementById('amountInput').value);
  const date = document.getElementById('dateInput').value;
  const note = document.getElementById('noteInput').value.trim();
  const err = document.getElementById('sendError');

  if (!amount || amount <= 0) { err.textContent = 'Entrez un montant valide.'; err.style.display = 'block'; return; }
  if (!date) { err.textContent = 'Choisissez une date.'; err.style.display = 'block'; return; }
  const paidNow = payments.filter(function (p) { return p.status === 'approved'; }).reduce(function (s, p) { return s + p.amount; }, 0);
  const remaining = TOTAL_DEBT - paidNow;
  if (amount > remaining) { err.textContent = 'Le montant depasse le reste du (' + remaining.toLocaleString('fr-FR') + ' EUR).'; err.style.display = 'block'; return; }
  err.style.display = 'none';

  await addDoc(collection(db, 'payments'), {
    amount: amount, date: date, note: note,
    status: 'pending',
    proposedBy: currentUser.email,
    deleteRequest: null,
    createdAt: serverTimestamp()
  });

  document.getElementById('amountInput').value = '';
  document.getElementById('noteInput').value = '';
  showTab('history');
};

window.approvePayment = async function (id) { await updateDoc(doc(db, 'payments', id), { status: 'approved' }); };
window.rejectPayment = async function (id) { await updateDoc(doc(db, 'payments', id), { status: 'rejected' }); };
window.requestDelete = function (id) { confirmingDelete = id; render(); };
window.cancelDelete = function () { confirmingDelete = null; render(); };
window.askDelete = async function (id) { await updateDoc(doc(db, 'payments', id), { deleteRequest: currentUser.email }); confirmingDelete = null; };
window.confirmDelete = async function (id) { await deleteDoc(doc(db, 'payments', id)); confirmingDelete = null; };
window.refuseDelete = async function (id) { await updateDoc(doc(db, 'payments', id), { deleteRequest: null }); };

window.sendMessage = async function () {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  await addDoc(collection(db, 'messages'), {
    text: text,
    author: currentUser.email,
    createdAt: serverTimestamp()
  });
};

function scrollChatBottom() {
  const box = document.getElementById('chatMessages');
  box.scrollTop = box.scrollHeight;
}

function fmtDate(d) {
  if (!d) return '';
  const p = d.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = ts.toDate();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function fmtDayLabel(ts) {
  if (!ts) return '';
  const d = ts.toDate();
  const today = new Date();
  const y = new Date(); y.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return "Aujourd'hui";
  if (d.toDateString() === y.toDateString()) return 'Hier';
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateBalance() {
  const paid = payments.filter(function (p) { return p.status === 'approved'; }).reduce(function (s, p) { return s + p.amount; }, 0);
  const remaining = Math.max(0, TOTAL_DEBT - paid);
  const pct = Math.round((paid / TOTAL_DEBT) * 100);
  document.getElementById('balanceDisplay').textContent = remaining.toLocaleString('fr-FR') + ' \u20AC';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('paidLabel').textContent = paid.toLocaleString('fr-FR') + ' \u20AC rembourse';
  document.getElementById('pctLabel').textContent = pct + ' %';
}

function render() {
  const list = document.getElementById('paymentsList');
  if (!payments.length) {
    list.innerHTML = '<div class="empty-state">Aucun versement pour le moment.</div>';
    return;
  }
  const isElodie = currentUser.email === EMAIL_ELODIE;

  list.innerHTML = payments.map(function (p) {
    const approved = p.status === 'approved';
    let badge = '<span class="badge badge-pending">En attente</span>';
    if (approved) badge = '<span class="badge badge-approved">Approuve</span>';
    if (p.status === 'rejected') badge = '<span class="badge badge-rejected">Refuse</span>';

    let actions = '';
    if (p.status === 'pending' && isElodie) {
      actions = '<div class="action-btns"><button class="btn btn-approve" onclick="approvePayment(\'' + p.id + '\')">Approuver</button><button class="btn btn-reject" onclick="rejectPayment(\'' + p.id + '\')">Refuser</button></div>';
    }

    const lock = approved ? '<div class="lock-line">Verrouille - suppression uniquement avec accord des deux</div>' : '';

    let del = '';
    if (confirmingDelete === p.id) {
      del = '<div class="delete-confirm">Demander la suppression de ce versement ?<div class="confirm-btns"><button class="btn-sm btn-sm-danger" onclick="askDelete(\'' + p.id + '\')">Oui, demander</button><button class="btn-sm btn-sm-cancel" onclick="cancelDelete()">Annuler</button></div></div>';
    } else if (!p.deleteRequest) {
      del = '<button class="delete-link" onclick="requestDelete(\'' + p.id + '\')">Demander la suppression</button>';
    } else if (p.deleteRequest === currentUser.email) {
      del = '<div class="delete-wait">Suppression demandee - en attente de l accord de l autre</div>';
    } else {
      const who = p.deleteRequest === EMAIL_NICO ? 'Nico' : 'Elodie';
      del = '<div class="delete-confirm">' + who + ' demande la suppression de ce versement.<div class="confirm-btns"><button class="btn-sm btn-sm-danger" onclick="confirmDelete(\'' + p.id + '\')">Confirmer</button><button class="btn-sm btn-sm-cancel" onclick="refuseDelete(\'' + p.id + '\')">Refuser</button></div></div>';
    }

    const author = p.proposedBy === EMAIL_NICO ? 'Nico' : 'Elodie';

    return '<div class="payment-card' + (approved ? ' approved' : '') + '">' +
      '<div class="payment-row"><div>' +
      '<div class="payment-amount">' + p.amount.toLocaleString('fr-FR') + ' \u20AC</div>' +
      '<div class="payment-meta">' + fmtDate(p.date) + ' - propose par ' + author + (p.note ? '<br>' + esc(p.note) : '') + '</div>' +
      '</div>' + badge + '</div>' + lock + actions + del + '</div>';
  }).join('');
}

function renderChat() {
  const box = document.getElementById('chatMessages');
  if (!messages.length) {
    box.innerHTML = '<div class="chat-empty">Aucun message.<br>Ecrivez le premier !</div>';
    return;
  }
  let html = '';
  let lastDay = '';
  messages.forEach(function (m) {
    const day = fmtDayLabel(m.createdAt);
    if (day && day !== lastDay) {
      html += '<div class="msg-day">' + day + '</div>';
      lastDay = day;
    }
    const mine = m.author === currentUser.email;
    html += '<div class="msg ' + (mine ? 'msg-mine' : 'msg-theirs') + '">' +
      esc(m.text).replace(/\n/g, '<br>') +
      '<span class="msg-time">' + fmtTime(m.createdAt) + '</span></div>';
  });
  box.innerHTML = html;
}

const chatInput = document.getElementById('chatInput');
chatInput.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

onAuthStateChanged(auth, function (user) {
  if (user && ALLOWED.includes(user.email)) {
    currentUser = user;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('loginError').style.display = 'none';
    const prenom = user.email === EMAIL_NICO ? 'Nico' : 'Elodie';
    document.getElementById('userGreeting').textContent = 'Connecte : ' + prenom;
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    showTab(user.email === EMAIL_ELODIE ? 'history' : 'send');

    const qp = query(collection(db, 'payments'), orderBy('createdAt', 'desc'));
    unsubP = onSnapshot(qp, function (snap) {
      payments = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      updateBalance();
      render();
    });

    const qm = query(collection(db, 'messages'), orderBy('createdAt', 'asc'));
    unsubM = onSnapshot(qm, function (snap) {
      const wasAtBottom = true;
      messages = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      renderChat();
      if (currentTab === 'chat') {
        lastSeenCount = messages.length;
        setTimeout(scrollChatBottom, 30);
      } else if (messages.length > lastSeenCount) {
        document.getElementById('chatDot').style.display = 'block';
      }
    });
  } else {
    currentUser = null;
    payments = [];
    messages = [];
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
  }
});
</script>
</body>
</html>
