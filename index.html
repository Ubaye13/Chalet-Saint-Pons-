<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalet Saint-Pons</title>
<meta name="theme-color" content="#0B120E">
<link rel="apple-touch-icon" href="C3rf_Gallery.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}

body{min-height:100vh;color:#EDEAE2;background:#0B120E}

#bgLayer{position:fixed;inset:0;z-index:-2;
  background-image:url('C3rf_Gallery.jpg');
  background-size:cover;background-position:center;background-repeat:no-repeat}
#bgVeil{position:fixed;inset:0;z-index:-1;
  background:linear-gradient(to bottom,rgba(11,18,14,.72) 0%,rgba(11,18,14,.62) 40%,rgba(11,18,14,.78) 100%)}

.hidden{display:none!important}

.hero{position:relative;padding:1.4rem 1.25rem 2.6rem}
.hero-title{font-size:19px;font-weight:600;color:#FFF;letter-spacing:.4px;text-shadow:0 2px 12px rgba(0,0,0,.95)}
.hero-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px;letter-spacing:.3px;text-shadow:0 1px 8px rgba(0,0,0,.95)}
.logout-btn{position:absolute;top:1.4rem;right:1.25rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#FFF;border-radius:20px;padding:7px 14px;font-size:11.5px;cursor:pointer;backdrop-filter:blur(14px)}

.glass{background:rgba(14,22,17,.42);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}

.balance-card{margin:0 1rem;border-radius:20px;padding:1.4rem;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.balance-label{font-size:11px;color:rgba(237,234,226,.62);margin-bottom:7px;text-transform:uppercase;letter-spacing:.9px}
.balance-amount{font-size:38px;font-weight:600;color:#FFF;line-height:1;letter-spacing:-.8px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.balance-total{font-size:12.5px;color:rgba(237,234,226,.5);margin-top:7px}
.progress-bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:1.2rem;overflow:hidden}
.progress-fill{height:100%;background:#A8C3A0;border-radius:3px;transition:width .7s ease;width:0%}
.progress-labels{display:flex;justify-content:space-between;font-size:11px;color:rgba(237,234,226,.5);margin-top:8px}

.tab-bar{display:flex;gap:6px;padding:1rem 1rem .3rem}
.tab{flex:1;padding:11px 4px;font-size:12px;font-weight:600;color:rgba(237,234,226,.55);border:1px solid rgba(255,255,255,.1);background:rgba(14,22,17,.35);border-radius:12px;cursor:pointer;position:relative;backdrop-filter:blur(14px);transition:all .2s}
.tab.active{color:#FFF;background:rgba(168,195,160,.18);border-color:rgba(168,195,160,.45)}
.tab-dot{position:absolute;top:6px;right:9px;width:6px;height:6px;background:#E0A088;border-radius:50%;display:none}

.section{padding:.8rem 1rem 1.5rem}
.section-title{font-size:10.5px;font-weight:600;color:rgba(237,234,226,.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:.85rem}

.payment-card{border-radius:16px;padding:1.05rem 1.15rem;margin-bottom:.65rem}
.payment-card.approved{border-left:3px solid #A8C3A0}
.payment-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.payment-amount{font-size:19px;font-weight:600;color:#FFF}
.payment-meta{font-size:11.5px;color:rgba(237,234,226,.55);margin-top:5px;line-height:1.5}
.lock-line{font-size:10.5px;color:rgba(237,234,226,.4);margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}
.badge{font-size:10.5px;padding:4px 11px;border-radius:20px;font-weight:600;white-space:nowrap;letter-spacing:.3px}
.badge-pending{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
.badge-approved{background:rgba(168,195,160,.24);color:#C4DCBC}
.badge-rejected{background:rgba(224,160,136,.2);color:#E8B8A4}

.action-btns{display:flex;gap:9px;margin-top:1rem}
.btn{flex:1;padding:11px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.btn-approve{background:#A8C3A0;color:#16231C}
.btn-reject{background:rgba(255,255,255,.1);color:#E8B8A4;border:1px solid rgba(224,160,136,.35)}
.delete-link{background:none;border:none;color:rgba(237,234,226,.38);font-size:11px;cursor:pointer;padding:10px 0 0;display:inline-block}
.delete-confirm{background:rgba(224,160,136,.12);border:1px solid rgba(224,160,136,.3);border-radius:12px;padding:11px 13px;margin-top:.85rem;font-size:12px;color:#E8B8A4;line-height:1.5}
.confirm-btns{display:flex;gap:8px;margin-top:11px}
.btn-sm{padding:7px 14px;border-radius:10px;font-size:12px;cursor:pointer;border:none;font-weight:600}
.btn-sm-danger{background:#D4917A;color:#1A1210}
.btn-sm-cancel{background:rgba(255,255,255,.1);color:rgba(237,234,226,.75);border:1px solid rgba(255,255,255,.16)}
.delete-wait{font-size:11px;color:rgba(237,234,226,.72);background:rgba(255,255,255,.08);border-radius:10px;padding:9px 12px;margin-top:10px;line-height:1.5}

.input-card{border-radius:18px;padding:1.3rem}
.field-label{font-size:10.5px;color:rgba(237,234,226,.5);margin-bottom:8px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.amount-input{width:100%;font-size:32px;font-weight:600;border:none;border-bottom:2px solid rgba(168,195,160,.45);padding:4px 0 11px;color:#FFF;background:transparent;outline:none;margin-bottom:1.4rem}
.amount-input::placeholder{color:rgba(255,255,255,.2)}
.amount-input:focus{border-bottom-color:#A8C3A0}
.date-input,.note-input{width:100%;font-size:14px;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px;margin-bottom:1.4rem;color:#EDEAE2;background:rgba(0,0,0,.28);outline:none;font-family:inherit}
.note-input{resize:none;height:68px}
.note-input::placeholder{color:rgba(255,255,255,.28)}
.date-input:focus,.note-input:focus{border-color:rgba(168,195,160,.5)}
.btn-send{width:100%;padding:14px;background:#A8C3A0;color:#16231C;border:none;border-radius:13px;font-size:15px;font-weight:600;cursor:pointer}
.btn-send:active{opacity:.85}
.send-error{font-size:12px;color:#E8B8A4;display:none;margin-bottom:12px}

.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 140px)}
.chat-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:9px}
.msg{max-width:78%;padding:11px 15px;border-radius:17px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg-mine{align-self:flex-end;background:rgba(168,195,160,.9);color:#16231C;border-bottom-right-radius:5px}
.msg-theirs{align-self:flex-start;background:rgba(14,22,17,.55);color:#EDEAE2;border:1px solid rgba(255,255,255,.14);border-bottom-left-radius:5px;backdrop-filter:blur(14px)}
.msg-time{font-size:9.5px;opacity:.6;margin-top:5px;display:block}
.msg-day{align-self:center;font-size:10.5px;color:rgba(237,234,226,.55);background:rgba(14,22,17,.5);padding:5px 15px;border-radius:20px;margin:9px 0;backdrop-filter:blur(12px)}
.chat-input-bar{display:flex;gap:9px;padding:.9rem;background:rgba(11,18,14,.6);border-top:1px solid rgba(255,255,255,.1);align-items:flex-end;backdrop-filter:blur(18px)}
.chat-input{flex:1;font-size:14px;border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:12px 17px;outline:none;resize:none;max-height:100px;font-family:inherit;color:#EDEAE2;background:rgba(0,0,0,.3)}
.chat-input::placeholder{color:rgba(255,255,255,.28)}
.chat-input:focus{border-color:rgba(168,195,160,.5)}
.chat-send{width:44px;height:44px;border-radius:50%;background:#A8C3A0;color:#16231C;border:none;font-size:17px;cursor:pointer;flex-shrink:0}
.chat-send:active{opacity:.85}
.chat-empty{text-align:center;color:rgba(237,234,226,.42);font-size:13px;margin:auto;line-height:1.9}

.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3rem 1.5rem 2.5rem;position:relative}
.login-screen::before{content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(to bottom,rgba(11,18,14,.9) 0%,rgba(11,18,14,.2) 26%,rgba(11,18,14,.12) 52%,rgba(11,18,14,.72) 82%,rgba(11,18,14,.96) 100%)}
.login-head{text-align:center}
.login-title{font-size:27px;font-weight:600;color:#FFF;margin-bottom:9px;letter-spacing:.5px;text-shadow:0 2px 16px rgba(0,0,0,.95)}
.login-sub{font-size:12.5px;color:rgba(255,255,255,.78);line-height:1.7;letter-spacing:.4px;text-shadow:0 2px 12px rgba(0,0,0,.95)}
.login-foot{width:100%;display:flex;flex-direction:column;align-items:center}
.login-card{width:100%;max-width:330px;border-radius:20px;padding:1.4rem}
.btn-google{width:100%;padding:13px;background:#F5F2EA;color:#1B2921;border:none;border-radius:12px;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:11px}
.btn-google:active{opacity:.9}
.login-error{font-size:12px;color:#E8B8A4;background:rgba(224,160,136,.18);border:1px solid rgba(224,160,136,.38);border-radius:12px;padding:11px 13px;margin-bottom:1.1rem;display:none;line-height:1.5}
.empty-state{text-align:center;padding:2.8rem 1rem;color:rgba(237,234,226,.42);font-size:13.5px;line-height:1.9}
.loading{text-align:center;padding:2rem;color:rgba(237,234,226,.42);font-size:12.5px}
</style>
</head>
<body>

<div id="bgLayer"></div>
<div id="bgVeil"></div>

<div id="loginScreen" class="login-screen">
  <div class="login-head">
    <div class="login-title">Chalet Saint-Pons</div>
    <div class="login-sub">Vallee de l'Ubaye<br>Alpes de Haute-Provence</div>
  </div>
  <div class="login-foot">
    <div class="login-card glass">
      <div class="login-error" id="loginError">Acces refuse. Compte non autorise.</div>
      <button class="btn-google" onclick="signInWithGoogle()">
        <svg width="19" height="19" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Se connecter avec Google
      </button>
    </div>
  </div>
</div>

<div id="mainApp" class="hidden">
  <div class="hero">
    <div class="hero-title">Chalet Saint-Pons</div>
    <div class="hero-sub" id="userGreeting"></div>
    <button class="logout-btn" onclick="doSignOut()">Deconnexion</button>
  </div>

  <div class="balance-card glass" id="balanceCard">
    <div class="balance-label">Reste a rembourser a Elodie</div>
    <div class="balance-amount" id="balanceDisplay">30 000 &euro;</div>
    <div class="balance-total">sur 30 000 &euro; au total</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-labels">
      <span id="paidLabel">0 &euro; rembourse</span>
      <span id="pctLabel">0 %</span>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" id="tabHistory" onclick="showTab('history')">Historique</button>
    <button class="tab" id="tabSend" onclick="showTab('send')">Versement</button>
    <button class="tab" id="tabChat" onclick="showTab('chat')">Messages<span class="tab-dot" id="chatDot"></span></button>
  </div>

  <div id="tabContentHistory">
    <div class="section">
      <div class="section-title">Versements</div>
      <div id="paymentsList"><div class="loading">Chargement...</div></div>
    </div>
  </div>

  <div id="tabContentSend" class="hidden">
    <div class="section">
      <div class="section-title">Proposer un versement</div>
      <div class="input-card glass">
        <label class="field-label">Montant</label>
        <input class="amount-input" id="amountInput" type="number" inputmode="decimal" placeholder="1000" min="1">
        <label class="field-label">Date du versement</label>
        <input class="date-input" id="dateInput" type="date">
        <label class="field-label">Note (facultatif)</label>
        <textarea class="note-input" id="noteInput" placeholder="Virement de janvier..."></textarea>
        <div class="send-error" id="sendError"></div>
        <button class="btn-send" onclick="proposePayment()">Envoyer pour approbation</button>
      </div>
    </div>
  </div>

  <div id="tabContentChat" class="hidden">
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessages"><div class="chat-empty">Chargement...</div></div>
      <div class="chat-input-bar">
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="Votre message..."></textarea>
        <button class="chat-send" onclick="sendMessage()">&#10148;</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHSH4J7y0HxPR2V6NgNUAHv343ivW6UPA",
  authDomain: "chalet-saint-pons.firebaseapp.com",
  projectId: "chalet-saint-pons",
  storageBucket: "chalet-saint-pons.firebasestorage.app",
  messagingSenderId: "809641153285",
  appId: "1:809641153285:web:69fb8eb0e56861646c1d6c"
};

const H_NICO = "6e405c892f5523fb75a280d01e5dcaee99d140f0c9495a5331e4e833385c5120";
const H_ELODIE = "8c75a0a565c570d9dcccc1d78453f5d1fda9232c9e0d52d238df01659649f65a";
const TOTAL_DEBT = 30000;

async function sha(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let myHash = "";
let confirmingDelete = null;
let payments = [];
let messages = [];
let unsubP = null;
let unsubM = null;
let currentTab = 'history';
let lastSeenCount = 0;

function nameFor(h) {
  if (h === H_NICO) return 'Nico';
  if (h === H_ELODIE) return 'Elodie';
  return 'Inconnu';
}

window.signInWithGoogle = async function () {
  try {
    const res = await signInWithPopup(auth, new GoogleAuthProvider());
    const h = await sha(res.user.email);
    if (h !== H_NICO && h !== H_ELODIE) {
      document.getElementById('loginError').style.display = 'block';
      await signOut(auth);
    }
  } catch (e) { console.error(e); }
};

window.doSignOut = async function () {
  if (unsubP) { unsubP(); unsubP = null; }
  if (unsubM) { unsubM(); unsubM = null; }
  await signOut(auth);
};

window.showTab = function (tab) {
  currentTab = tab;
  document.getElementById('tabContentHistory').classList.toggle('hidden', tab !== 'history');
  document.getElementById('tabContentSend').classList.toggle('hidden', tab !== 'send');
  document.getElementById('tabContentChat').classList.toggle('hidden', tab !== 'chat');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('tabSend').classList.toggle('active', tab === 'send');
  document.getElementById('tabChat').classList.toggle('active', tab === 'chat');
  document.getElementById('balanceCard').classList.toggle('hidden', tab === 'chat');
  if (tab === 'chat') {
    lastSeenCount = messages.length;
    document.getElementById('chatDot').style.display = 'none';
    setTimeout(scrollChatBottom, 50);
  }
};

window.proposePayment = async function () {
  const amount = parseFloat(document.getElementById('amountInput').value);
  const date = document.getElementById('dateInput').value;
  const note = document.getElementById('noteInput').value.trim();
  const err = document.getElementById('sendError');

  if (!amount || amount <= 0) { err.textContent = 'Entrez un montant valide.'; err.style.display = 'block'; return; }
  if (!date) { err.textContent = 'Choisissez une date.'; err.style.display = 'block'; return; }
  const paidNow = payments.filter(function (p) { return p.status === 'approved'; }).reduce(function (s, p) { return s + p.amount; }, 0);
  const remaining = TOTAL_DEBT - paidNow;
  if (amount > remaining) { err.textContent = 'Le montant depasse le reste du (' + remaining.toLocaleString('fr-FR') + ' EUR).'; err.style.display = 'block'; return; }
  err.style.display = 'none';

  await addDoc(collection(db, 'payments'), {
    amount: amount, date: date, note: note,
    status: 'pending',
    proposedBy: myHash,
    deleteRequest: null,
    createdAt: serverTimestamp()
  });

  document.getElementById('amountInput').value = '';
  document.getElementById('noteInput').value = '';
  showTab('history');
};

window.approvePayment = async function (id) { await updateDoc(doc(db, 'payments', id), { status: 'approved' }); };
window.rejectPayment = async function (id) { await updateDoc(doc(db, 'payments', id), { status: 'rejected' }); };
window.requestDelete = function (id) { confirmingDelete = id; render(); };
window.cancelDelete = function () { confirmingDelete = null; render(); };
window.askDelete = async function (id) { await updateDoc(doc(db, 'payments', id), { deleteRequest: myHash }); confirmingDelete = null; };
window.confirmDelete = async function (id) { await deleteDoc(doc(db, 'payments', id)); confirmingDelete = null; };
window.refuseDelete = async function (id) { await updateDoc(doc(db, 'payments', id), { deleteRequest: null }); };

window.sendMessage = async function () {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  await addDoc(collection(db, 'messages'), {
    text: text,
    author: myHash,
    createdAt: serverTimestamp()
  });
};

function scrollChatBottom() {
  const box = document.getElementById('chatMessages');
  box.scrollTop = box.scrollHeight;
}

function fmtDate(d) {
  if (!d) return '';
  const p = d.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = ts.toDate();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function fmtDayLabel(ts) {
  if (!ts) return '';
  const d = ts.toDate();
  const today = new Date();
  const y = new Date(); y.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return "Aujourd'hui";
  if (d.toDateString() === y.toDateString()) return 'Hier';
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateBalance() {
  const paid = payments.filter(function (p) { return p.status === 'approved'; }).reduce(function (s, p) { return s + p.amount; }, 0);
  const remaining = Math.max(0, TOTAL_DEBT - paid);
  const pct = Math.round((paid / TOTAL_DEBT) * 100);
  document.getElementById('balanceDisplay').textContent = remaining.toLocaleString('fr-FR') + ' \u20AC';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('paidLabel').textContent = paid.toLocaleString('fr-FR') + ' \u20AC rembourse';
  document.getElementById('pctLabel').textContent = pct + ' %';
}

function render() {
  const list = document.getElementById('paymentsList');
  if (!payments.length) {
    list.innerHTML = '<div class="empty-state">Aucun versement pour le moment.</div>';
    return;
  }
  const isElodie = myHash === H_ELODIE;

  list.innerHTML = payments.map(function (p) {
    const approved = p.status === 'approved';
    let badge = '<span class="badge badge-pending">En attente</span>';
    if (approved) badge = '<span class="badge badge-approved">Approuve</span>';
    if (p.status === 'rejected') badge = '<span class="badge badge-rejected">Refuse</span>';

    let actions = '';
    if (p.status === 'pending' && isElodie) {
      actions = '<div class="action-btns"><button class="btn btn-approve" onclick="approvePayment(\'' + p.id + '\')">Approuver</button><button class="btn btn-reject" onclick="rejectPayment(\'' + p.id + '\')">Refuser</button></div>';
    }

    const lock = approved ? '<div class="lock-line">Verrouille - suppression uniquement avec accord des deux</div>' : '';

    let del = '';
    if (confirmingDelete === p.id) {
      del = '<div class="delete-confirm">Demander la suppression de ce versement ?<div class="confirm-btns"><button class="btn-sm btn-sm-danger" onclick="askDelete(\'' + p.id + '\')">Oui, demander</button><button class="btn-sm btn-sm-cancel" onclick="cancelDelete()">Annuler</button></div></div>';
    } else if (!p.deleteRequest) {
      del = '<button class="delete-link" onclick="requestDelete(\'' + p.id + '\')">Demander la suppression</button>';
    } else if (p.deleteRequest === myHash) {
      del = '<div class="delete-wait">Suppression demandee - en attente de l accord de l autre</div>';
    } else {
      del = '<div class="delete-confirm">' + nameFor(p.deleteRequest) + ' demande la suppression de ce versement.<div class="confirm-btns"><button class="btn-sm btn-sm-danger" onclick="confirmDelete(\'' + p.id + '\')">Confirmer</button><button class="btn-sm btn-sm-cancel" onclick="refuseDelete(\'' + p.id + '\')">Refuser</button></div></div>';
    }

    return '<div class="payment-card glass' + (approved ? ' approved' : '') + '">' +
      '<div class="payment-row"><div>' +
      '<div class="payment-amount">' + p.amount.toLocaleString('fr-FR') + ' \u20AC</div>' +
      '<div class="payment-meta">' + fmtDate(p.date) + ' &middot; ' + nameFor(p.proposedBy) + (p.note ? '<br>' + esc(p.note) : '') + '</div>' +
      '</div>' + badge + '</div>' + lock + actions + del + '</div>';
  }).join('');
}

function renderChat() {
  const box = document.getElementById('chatMessages');
  if (!messages.length) {
    box.innerHTML = '<div class="chat-empty">Aucun message.<br>Ecrivez le premier !</div>';
    return;
  }
  let html = '';
  let lastDay = '';
  messages.forEach(function (m) {
    const day = fmtDayLabel(m.createdAt);
    if (day && day !== lastDay) {
      html += '<div class="msg-day">' + day + '</div>';
      lastDay = day;
    }
    const mine = m.author === myHash;
    html += '<div class="msg ' + (mine ? 'msg-mine' : 'msg-theirs') + '">' +
      esc(m.text).replace(/\n/g, '<br>') +
      '<span class="msg-time">' + fmtTime(m.createdAt) + '</span></div>';
  });
  box.innerHTML = html;
}

document.getElementById('chatInput').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

onAuthStateChanged(auth, async function (user) {
  let ok = false;
  if (user) {
    myHash = await sha(user.email);
    ok = (myHash === H_NICO || myHash === H_ELODIE);
  }

  if (ok) {
    currentUser = user;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('userGreeting').textContent = nameFor(myHash);
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    showTab(myHash === H_ELODIE ? 'history' : 'send');

    const qp = query(collection(db, 'payments'), orderBy('createdAt', 'desc'));
    unsubP = onSnapshot(qp, function (snap) {
      payments = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      updateBalance();
      render();
    });

    const qm = query(collection(db, 'messages'), orderBy('createdAt', 'asc'));
    unsubM = onSnapshot(qm, function (snap) {
      messages = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      renderChat();
      if (currentTab === 'chat') {
        lastSeenCount = messages.length;
        setTimeout(scrollChatBottom, 30);
      } else if (messages.length > lastSeenCount) {
        document.getElementById('chatDot').style.display = 'block';
      }
    });
  } else {
    currentUser = null;
    myHash = '';
    payments = [];
    messages = [];
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
  }
});
</script>
